<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="The 11 Claude skills for LinkedIn outreach grouped into five pipeline stages, with a person reviewing every message before it sends">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h  { font-size: 17px; font-weight: 700; fill: #18181b; }
      .cap { font-size: 11px; fill: #a1a1aa; }
      .st { font-size: 12px; font-weight: 700; fill: #18181b; }
      .sn { font-size: 11px; font-weight: 700; fill: #7c3aed; }
      .n  { font-size: 10.5px; font-weight: 700; fill: #7c3aed; }
      .it { font-size: 11.5px; fill: #3f3f46; }
      .bh { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
      .bb { font-size: 12px; fill: #ede9fe; }
    </style>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#ffffff"/>

  <text class="t h" x="24" y="32">The 11 skills as one outreach pipeline</text>
  <text class="t cap" x="24" y="52">Grouped by where they sit. Every stage feeds the next; a person still signs off every message.</text>

  <!-- Stage headers -->
  <text class="t sn" x="24" y="88">1</text><text class="t st" x="36" y="88">Define</text>
  <text class="t sn" x="160" y="88">2</text><text class="t st" x="172" y="88">Research</text>
  <text class="t sn" x="296" y="88">3</text><text class="t st" x="308" y="88">Write</text>
  <text class="t sn" x="432" y="88">4</text><text class="t st" x="444" y="88">Operate</text>
  <text class="t sn" x="568" y="88">5</text><text class="t st" x="580" y="88">Learn &amp; route</text>

  <!-- Define -->
  <rect x="24" y="100" width="128" height="46" rx="9" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text class="t n" x="36" y="117">01</text><text class="t it" x="36" y="135">ICP &amp; scoring</text>

  <!-- Research -->
  <rect x="160" y="100" width="128" height="46" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
  <text class="t n" x="172" y="117">02</text><text class="t it" x="172" y="135">Research briefs</text>
  <rect x="160" y="154" width="128" height="46" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
  <text class="t n" x="172" y="171">03</text><text class="t it" x="172" y="189">Profile insights</text>

  <!-- Write -->
  <rect x="296" y="100" width="128" height="46" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
  <text class="t n" x="308" y="117">04</text><text class="t it" x="308" y="135">Message drafts</text>
  <rect x="296" y="154" width="128" height="46" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
  <text class="t n" x="308" y="171">05</text><text class="t it" x="308" y="189">Follow-up cadence</text>
  <rect x="296" y="208" width="128" height="46" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
  <text class="t n" x="308" y="225">06</text><text class="t it" x="308" y="243">Objection replies</text>

  <!-- Operate -->
  <rect x="432" y="100" width="128" height="46" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
  <text class="t n" x="444" y="117">07</text><text class="t it" x="444" y="135">CRM logging</text>
  <rect x="432" y="154" width="128" height="46" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
  <text class="t n" x="444" y="171">08</text><text class="t it" x="444" y="189">Pre-call briefs</text>
  <rect x="432" y="208" width="128" height="46" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
  <text class="t n" x="444" y="225">09</text><text class="t it" x="444" y="243">Warm-up plan</text>

  <!-- Learn & route -->
  <rect x="568" y="100" width="128" height="46" rx="9" fill="#fafafa" stroke="#e4e4e7"/>
  <text class="t n" x="580" y="117">10</text><text class="t it" x="580" y="135">Reply-rate review</text>
  <rect x="568" y="154" width="128" height="46" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="t n" x="580" y="171" style="fill:#047857">11</text><text class="t it" x="580" y="189">Lead scoring</text>

  <!-- Stage arrows -->
  <path d="M152 123 L159 123" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#p)"/>
  <path d="M288 123 L295 123" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#p)"/>
  <path d="M424 123 L431 123" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#p)"/>
  <path d="M560 123 L567 123" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#p)"/>

  <!-- Human gate below Write -->
  <path d="M360 258 L360 284" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#p)"/>
  <rect x="24" y="290" width="672" height="62" rx="12" fill="#7c3aed"/>
  <text class="t bh" x="44" y="316">A person edits every message before it sends</text>
  <text class="t bb" x="44" y="337">Claude does the research and the typing. People make the judgment calls and own the relationship.</text>
</svg>
