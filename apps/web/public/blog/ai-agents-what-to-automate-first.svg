<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" width="720" height="496" role="img" aria-label="A two-by-two chart plotting business tasks by how repetitive they are against how much judgment they need, showing which to automate first">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .h  { font-size: 17px; font-weight: 700; fill: #18181b; }
      .cap { font-size: 11px; fill: #a1a1aa; }
      .ql { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
      .ax { font-size: 11.5px; font-weight: 600; fill: #71717a; }
      .it { font-size: 12px; fill: #3f3f46; }
      .qs { font-size: 11px; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d4d4d8"/>
    </marker>
  </defs>
  <rect width="720" height="496" fill="#ffffff"/>

  <text class="t h" x="24" y="32">What to automate first</text>
  <text class="t cap" x="24" y="52">Two or more boxes checked in the green quadrant means it is a strong candidate.</text>

  <!-- Quadrant backgrounds -->
  <rect x="104" y="72" width="292" height="156" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
  <rect x="400" y="72" width="292" height="156" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <rect x="104" y="236" width="292" height="178" rx="10" fill="#fafafa" stroke="#e4e4e7"/>
  <rect x="400" y="236" width="292" height="178" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>

  <!-- Top-left: keep human -->
  <text class="t ql" x="120" y="96" fill="#be123c">KEEP HUMAN</text>
  <text class="t qs" x="120" y="114" fill="#9f1239">Nuanced calls, sensitive</text>
  <text class="t qs" x="120" y="130" fill="#9f1239">relationships, high blast radius.</text>
  <text class="t it" x="120" y="158" style="fill:#881337">· Pricing and strategy decisions</text>
  <text class="t it" x="120" y="178" style="fill:#881337">· Difficult client conversations</text>
  <text class="t it" x="120" y="198" style="fill:#881337">· Hiring and performance calls</text>

  <!-- Top-right: process not decision -->
  <text class="t ql" x="416" y="96" fill="#b45309">AUTOMATE THE PROCESS,</text>
  <text class="t ql" x="416" y="112" fill="#b45309">NOT THE DECISION</text>
  <text class="t qs" x="416" y="132" fill="#92400e">Agent drafts and prepares;</text>
  <text class="t qs" x="416" y="148" fill="#92400e">a human still approves.</text>
  <text class="t it" x="416" y="176" style="fill:#78350f">· Proposals and quotes</text>
  <text class="t it" x="416" y="196" style="fill:#78350f">· Escalated support replies</text>

  <!-- Bottom-left: not worth it -->
  <text class="t ql" x="120" y="262" fill="#71717a">NOT WORTH IT YET</text>
  <text class="t qs" x="120" y="280" fill="#71717a">One-off and low-volume. Build</text>
  <text class="t qs" x="120" y="296" fill="#71717a">costs more than it returns.</text>
  <text class="t it" x="120" y="324">· Annual filings</text>
  <text class="t it" x="120" y="344">· Ad-hoc research requests</text>

  <!-- Bottom-right: start here -->
  <text class="t ql" x="416" y="262" fill="#047857">START HERE</text>
  <text class="t qs" x="416" y="280" fill="#065f46">Repetitive, rule-based, time-heavy —</text>
  <text class="t qs" x="416" y="296" fill="#065f46">and not judgment-heavy.</text>
  <text class="t it" x="416" y="320" style="fill:#064e3b">· Inbox and calendar management</text>
  <text class="t it" x="416" y="338" style="fill:#064e3b">· Lead follow-up and CRM updates</text>
  <text class="t it" x="416" y="356" style="fill:#064e3b">· Client onboarding</text>
  <text class="t it" x="416" y="374" style="fill:#064e3b">· Reporting and data pulling</text>
  <text class="t it" x="416" y="392" style="fill:#064e3b">· Internal ops coordination</text>

  <!-- Axes -->
  <line x1="88" y1="414" x2="88" y2="72" stroke="#d4d4d8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="104" y1="430" x2="692" y2="430" stroke="#d4d4d8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="t ax" x="-243" y="76" transform="rotate(-90)" text-anchor="middle">Judgment required</text>
  <text class="t ax" x="398" y="450" text-anchor="middle">How repetitive and rule-based the task is</text>
  <text class="t cap" x="104" y="470">Low</text>
  <text class="t cap" x="692" y="470" text-anchor="end">High</text>
</svg>
